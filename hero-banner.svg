<svg viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#39d353"/>
      <stop offset="100%" stop-color="#58a6ff"/>
      <animate attributeName="x1" values="-20%;100%;-20%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;120%;0%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="revealLine1">
      <rect x="0" y="60" width="0" height="24">
        <animate attributeName="width" values="0;600;600;600;0" keyTimes="0;0.3;0.6;0.95;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="150" fill="#0d1117"/>
  <rect x="0" y="0" width="900" height="3" fill="url(#accent)"/>

  <text x="40" y="50" font-family="Consolas, 'Fira Code', monospace" font-size="26" fill="#e6edf3" font-weight="600">Niranjan Tapasvi</text>

  <text x="40" y="79" font-family="Consolas, 'Fira Code', monospace" font-size="15" fill="#39d353">&gt;</text>

  <text x="58" y="79" font-family="Consolas, 'Fira Code', monospace" font-size="15" fill="#c9d1d9" clip-path="url(#revealLine1)">Building AI agent safety systems, perception, and applied ML</text>

  <rect x="58" y="63" width="8" height="18" fill="#39d353">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.51;1;1" dur="0.9s" repeatCount="indefinite"/>
    <animateMotion path="M0,0 L600,0" keyTimes="0;0.3;0.6;0.95;1" keyPoints="0;1;1;1;0" calcMode="linear" dur="9s" repeatCount="indefinite"/>
  </rect>

  <text x="40" y="112" font-family="Consolas, monospace" font-size="13" fill="#8b949e">MS Data Science, Indiana University Bloomington</text>
  <text x="40" y="134" font-family="Consolas, monospace" font-size="12" fill="#484f58">agent-safety · perception · rag · autonomous-systems</text>
</svg>
